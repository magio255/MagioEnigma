# MagioEnigma Config Configuration

# List of banned item material names (in uppercase Bukkit Material enum names)
banned-items:
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - DEBUG_STICK
  - LIGHT

# Options for Banned Items enforcement on non-OP players
banned-items-settings:
  enabled: true
  check-interval-ticks: 20
  notify-player: true
  notification-message: "&c[MagioEnigma] Zakazany predmet (%item%) byl odstranen z tveho inventare!"

# Options for Villager Security enforcement
villager-security-settings:
  enabled: true
  check-interval-ticks: 100
  log-removal: true
  log-message: "&c[MagioEnigma] Nelegalni villager s zakazanymi obchody byl vymazan na souradnicich: %location%"

# Options for Large Stack Detection
large-stack-settings:
  enabled: true
  # Number of inventory slots filled with monitored valuable items before triggering an instant ban
  slot-threshold: 20
  # List of valuable materials to monitor
  monitored-items:
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - DIAMOND_BLOCK
    - NETHERITE_SCRAP
    - ANCIENT_DEBRIS
    - DIAMOND
    - EMERALD_BLOCK
    - GOLD_BLOCK
  # Console command executed to ban the player
  ban-command: "ban %player% [MagioEnigma] Detekovano nelegalni mnozstvi cennosti (%count% slotu %items%)"
  broadcast: true
  broadcast-message: "&c[MagioEnigma] Hrac %player% byl zabanovan za Large Stack Detection (%count% slotu %items%)."
